<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Time Machine HUD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Literata:opsz,wght@7..72,400&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* ---------- design tokens: the two tune panels write these ---------- */
:root{
 --glass:.12;--blur:2px;--sat:120%;--title:18.5px;--top:12px;--inset:7px;--radius:14px;--bar:4.5px;
 --tint:#080b10;--sheen:.3;--textGlow:.35;--ink:#f4f6f8;
 --tripFill:#a9dcff;--nextFill:#a9dcff;--barGlow:.5;
 --btn:#262b32;--finish:.5;--edge:.18;--shadow:.5;--keyR:12px;--key:52px;
 --light:#a9dcff;--stop:#ff4a3d;--pause:#ffb22e;--glow:.6;--halo:.55;--haloSize:14px;
 --muted:#aeb7c1;
 --hudFont:'Space Grotesk',system-ui,sans-serif;--dateFont:'JetBrains Mono',monospace;--dateSize:15px;--cardSize:16.5px;--labelSize:10.5px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:#f4f6f8;font-family:'Space Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}

/* ---------- page layout ---------- */
#stage{position:relative;overflow:hidden;width:100vw;height:100vh;height:100dvh;background:#000;grid-area:stage}
.panel{grid-area:var(--area);background:#1c2026;border:1px solid #2c3139;border-radius:16px;padding:16px 18px 18px;font-size:13px;color:#d6dbe1;overflow:auto}
#look{--area:look}#layout{--area:layout}
@media (min-width:1120px){
 body{background:#14171c}
 .wrap{height:100%;display:grid;grid-template-columns:290px 390px 290px;grid-template-areas:"look stage layout";gap:28px;justify-content:center;align-content:center;padding:24px}
 .panel{max-height:844px;align-self:center}
}
@media (min-width:900px) and (max-width:1119px){
 body{background:#14171c}
 .wrap{height:100%;display:grid;grid-template-columns:390px 300px;grid-template-rows:418px 418px;grid-template-areas:"stage look" "stage layout";gap:8px 28px;justify-content:center;align-content:center;padding:24px}
}
@media (min-width:900px){
 #stage{width:390px;height:844px;border-radius:44px;box-shadow:0 0 0 10px #050608,0 0 0 11px #2a2e35,0 30px 80px rgba(0,0,0,.6)}
 :root{--top:44px}
 .tabs{display:none}
}
@media (max-width:899px){
 .panel{position:fixed;left:8px;right:8px;bottom:8px;max-height:62vh;z-index:20;transform:translateY(110%);transition:transform .3s;box-shadow:0 -10px 40px rgba(0,0,0,.6)}
 .panel.open{transform:none}
}

/* ---------- pictures and tunnel ---------- */
.pic{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s ease}
.pic.on{opacity:1}
canvas{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .6s ease}
canvas.on{opacity:1}

/* ---------- glass (top panel and optional tray) ---------- */
.glass{background:linear-gradient(180deg,rgba(255,255,255,calc(var(--sheen)*.12)),rgba(255,255,255,0) 60%),color-mix(in srgb,var(--tint) calc(var(--glass)*100%),transparent);
 border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,var(--edge));
 -webkit-backdrop-filter:blur(var(--blur)) saturate(var(--sat));backdrop-filter:blur(var(--blur)) saturate(var(--sat))}

/* ---------- top panel ---------- */
#hud{position:absolute;left:var(--inset);right:var(--inset);top:calc(env(safe-area-inset-top) + var(--top));padding:11px 14px 12px;border-radius:var(--radius);display:flex;flex-direction:column;gap:9px;z-index:5}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.lit{color:var(--ink);text-shadow:0 0 calc(var(--textGlow)*10px) color-mix(in srgb,var(--ink) calc(var(--textGlow)*70%),transparent),0 1px 2px rgba(0,0,0,.45)}
#title{--ink:var(--headCol);font-family:var(--hudFont);font-size:var(--title);font-weight:600;letter-spacing:-.01em;line-height:1.2;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#title.small{font-size:calc(var(--title) * .84)}
#title.wrap2{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#title.deck{font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
#date{--ink:var(--dateCol);font-family:var(--dateFont);font-size:var(--dateSize);font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums;align-self:flex-start;padding-top:2px}
#date small{font-size:.72em;opacity:.75;margin-left:3px}
.bars{display:flex;flex-direction:column;gap:4px}
.bar{height:var(--bar);border-radius:3px;background:rgba(255,255,255,.12)}
.bar i{display:block;height:100%;border-radius:3px;width:0}
#tripBar i{background:var(--tripFill);box-shadow:0 0 calc(var(--barGlow)*8px) var(--tripFill)}
#nextBar{background:rgba(255,255,255,.08)}
#nextBar i{background:var(--nextFill);box-shadow:0 0 calc(var(--barGlow)*10px) var(--nextFill)}

/* ---------- text card, map ---------- */
#card{position:absolute;left:var(--inset);right:var(--inset);border-radius:var(--radius);background:rgba(10,13,18,.93);border:1px solid rgba(255,255,255,.08);padding:20px 20px 24px;overflow:auto;z-index:4;opacity:0;pointer-events:none;transition:opacity .3s}
#card.on{opacity:1;pointer-events:auto}
#card p{margin:0;font-family:'Literata',Georgia,serif;font-size:var(--cardSize);line-height:1.6;color:#e8ebef}
#card p.note{font-family:'Space Grotesk',sans-serif;font-size:14px;color:var(--muted)}
#map{position:absolute;inset:0;z-index:3;opacity:0;pointer-events:none;transition:opacity .3s;background:#1b1f24 repeating-linear-gradient(35deg,transparent 0 46px,rgba(255,255,255,.035) 46px 48px);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px}
#map.on{opacity:1}

/* ---------- the console: separate keys ---------- */
#dock{position:absolute;left:var(--inset);right:var(--inset);bottom:calc(env(safe-area-inset-bottom) + 22px);padding:8px;border-radius:calc(var(--keyR) + 8px);display:flex;align-items:center;gap:8px;z-index:5}
#dock.notray{background:none;border-color:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;padding:8px 0}
.key{--c:var(--light);position:relative;height:var(--key);border-radius:var(--keyR);border:1px solid rgba(255,255,255,.07);padding:0;overflow:hidden;
 background:linear-gradient(180deg,color-mix(in oklab,var(--btn),white calc(var(--finish)*16%)) 0%,var(--btn) 48%,color-mix(in oklab,var(--btn),black calc(var(--finish)*34%)) 100%);
 box-shadow:inset 0 1px 0 rgba(255,255,255,calc(var(--edge)*1.2)),inset 0 -1px 0 rgba(0,0,0,.35),0 calc(var(--shadow)*6px) calc(var(--shadow)*14px) rgba(0,0,0,calc(var(--shadow)*.7));
 display:flex;align-items:center;justify-content:center;transition:box-shadow .25s,border-color .25s,transform .08s}
.key:active{transform:translateY(1px)}
.key.sq{width:var(--key);flex:none}
.glyph svg{width:calc(var(--key) * .38);height:calc(var(--key) * .38)}
#title.deck{font-size:calc(var(--title) * .62)}
.key.view{flex:1;min-width:0}
.glyph{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--c);opacity:.82;
 filter:drop-shadow(0 0 calc(var(--glow)*5px) color-mix(in srgb,var(--c) calc(var(--glow)*90%),transparent));transition:opacity .25s,filter .25s}
.glyph span{font-family:var(--hudFont);font-size:var(--labelSize);font-weight:600;letter-spacing:.12em;text-transform:uppercase}
#dock.nolabels .glyph span{display:none}
.key.on{border-color:color-mix(in srgb,var(--c) calc(var(--halo)*70%),transparent);
 box-shadow:inset 0 1px 0 rgba(255,255,255,calc(var(--edge)*1.2)),inset 0 -1px 0 rgba(0,0,0,.35),0 calc(var(--shadow)*6px) calc(var(--shadow)*14px) rgba(0,0,0,calc(var(--shadow)*.7)),
  0 0 var(--haloSize) color-mix(in srgb,var(--c) calc(var(--halo)*85%),transparent),inset 0 0 calc(var(--haloSize)*.6) color-mix(in srgb,var(--c) calc(var(--halo)*25%),transparent)}
.key.on .glyph{opacity:1;filter:drop-shadow(0 0 calc(var(--glow)*7px) var(--c))}
#stop{--c:var(--stop)}#pause{--c:var(--pause)}
#stop::before{content:"";position:absolute;inset:0;background:color-mix(in srgb,var(--stop) 30%,transparent);transform:scaleY(0);transform-origin:bottom}
#stop.holding::before{transform:scaleY(1);transition:transform .9s linear}
#toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px + var(--key) + 30px);transform:translateX(-50%);background:rgba(10,13,18,.92);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:8px 12px;font-size:13px;white-space:nowrap;z-index:6;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.on{opacity:1}

/* ---------- tune panels ---------- */
.panel h2{margin:0;font-size:15px;font-weight:600;color:#fff;display:flex;align-items:baseline;gap:8px}
.panel h2 em{font-style:normal;font-weight:400;font-size:11px;color:#8f99a4}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;height:32px;border-radius:8px;border:1px solid #3a414b;background:#262b33;color:#cfd5dc;font-size:13px}
.tabs button[aria-pressed="true"]{background:#e9eef3;color:#0b0e12;border-color:#e9eef3}
@media (min-width:900px){.panel .tabs{display:none}}
.panel .hint{margin:4px 0 6px;color:#8f99a4;font-size:12px;line-height:1.45}
.panel h3{margin:16px 0 0;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#7f8994;border-top:1px solid #2c3139;padding-top:12px}
.panel label{display:block;margin:10px 0 4px;color:#aeb7c1}
.panel label span{float:right;font-family:'JetBrains Mono',monospace;color:#fff}
.panel label.tg{display:flex;align-items:center;justify-content:space-between}
.panel input[type=range]{width:100%;accent-color:#c41a1a;margin:0}
.panel select,.panel input[type=color]{width:100%;height:32px;background:#12151a;color:#fff;border:1px solid #333a43;border-radius:8px;padding:0 8px;font:inherit}
.panel input[type=color]{padding:2px}
.sw{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;margin-top:10px}
.sw label{white-space:nowrap;display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0;font-size:12.5px}
.panel .sw input[type=color]{width:40px;height:26px;flex:none;border-radius:6px;padding:1px}
.panel input[type=checkbox]{width:18px;height:18px;accent-color:#c41a1a}
.tb{display:flex;gap:8px;margin-top:16px}
.tb button{flex:1;height:36px;border-radius:8px;border:1px solid #3a414b;background:#262b33;color:#fff;font-size:13px}
#out{width:100%;height:140px;margin-top:10px;background:#12151a;color:#cfe3ef;border:1px solid #333a43;border-radius:8px;font:11px/1.4 'JetBrains Mono',monospace;padding:8px;display:none}
</style>
</head>
<body>
<div class="wrap">

<aside class="panel" id="look" aria-label="Look">
 <div class="tabs"><button data-tab="look" aria-pressed="true">Look</button><button data-tab="layout" aria-pressed="false">Layout</button></div>
 <h2>Look</h2>
 <p class="hint">Materials, colours and light.</p>
 <div id="lookCtl"></div>
</aside>

<div id="stage">
 <img class="pic" id="picDino" src="img/dino.jpg?v=4" alt="Sauropods in a Mesozoic forest">
 <img class="pic" id="picEarth" src="img/earth.jpg?v=4" alt="The Earth from space">
 <canvas id="gl"></canvas>
 <canvas id="ov"></canvas>
 <div id="map">Map view — not part of this mockup</div>
 <div id="card"><p id="cardText"></p></div>

 <header id="hud" class="glass">
  <div class="row"><div id="title" class="lit"></div><div id="date" class="lit"></div></div>
  <div class="bars"><div class="bar" id="tripBar"><i></i></div><div class="bar" id="nextBar"><i></i></div></div>
 </header>

 <div id="toast" role="status"></div>

 <nav id="dock" class="glass">
  <button class="key sq" id="stop" aria-label="Stop trip (press and hold)"><span class="glyph"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2" width="12" height="12" rx="2.5" fill="currentColor"/></svg></span></button>
  <button class="key sq" id="pause" aria-label="Pause" aria-pressed="false"><span class="glyph"><svg id="pauseIco" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2" width="3.5" height="12" rx="1" fill="currentColor"/><rect x="9.5" y="2" width="3.5" height="12" rx="1" fill="currentColor"/></svg></span></button>
  <button class="key view" data-mode="map" aria-pressed="false"><span class="glyph"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg><span>Map</span></span></button>
  <button class="key view" data-mode="text" aria-pressed="false"><span class="glyph"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Text</span></span></button>
  <button class="key view" data-mode="image" aria-pressed="true"><span class="glyph"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m3 16 5-5 4 4 3-3 6 6"/></svg><span>Image</span></span></button>
 </nav>
</div>

<aside class="panel" id="layout" aria-label="Layout">
 <div class="tabs"><button data-tab="look" aria-pressed="false">Look</button><button data-tab="layout" aria-pressed="true">Layout</button></div>
 <h2>Layout <em>v7</em></h2>
 <p class="hint">On a phone, tap the top panel to open or close the tuning. Values are kept on this device. "Copy values" gives all numbers, both panels, for Sven.</p>
 <label for="scene">Scene</label>
 <select id="scene">
  <option value="tunnel">Filler · tunnel (live)</option>
  <option value="dino">Event · The age of dinosaurs</option>
  <option value="earth">Event · Modern Earth (dark)</option>
  <option value="long">Event · long heading test</option>
 </select>
 <div id="layoutCtl"></div>
 <div class="tb"><button id="pCar">Car preset</button><button id="pHand">Hand preset</button></div>
 <div class="tb" style="margin-top:8px"><button id="reset">Reset all</button><button id="copy">Copy values</button></div>
 <textarea id="out" readonly aria-label="Current values"></textarea>
</aside>
</div>

<script>
const $=id=>document.getElementById(id);
const root=document.documentElement;

/* ---------- scenes (texts from the master file, Universe ENG) ---------- */
const SCENES={
 dino:{pic:'picDino',h:'The age of dinosaurs.',d:['144.1','Ma'],trip:.989557,next:.38,
  text:"Dinosaurs are the large animals of the world, and have been for a long time already. Long-necked plant-eaters the length of a tennis court, armoured ones built like tanks, hunters of every size. Flowering plants are only starting to appear; most of the green is conifer, fern and cycad. The number worth holding on to is not how big they were. It is how long this lasts. Their world has been running for eighty million years, and it has almost as long again to run. Everything that comes after it — every whale, every grassland, every monkey, every human — gets less than half of that. There are mammals in this world. But they are the size of rats and they come out at night. Not exactly their world. For a hundred and sixty million years, this is simply how the Earth is."},
 earth:{pic:'picEarth',h:'Modern Earth.',d:['23','Ma'],trip:.998333,next:.45,
  text:"The continents reach nearly their present places and grasslands spread through the drying interiors. Antarctica has lain under ice for ten million years already; the Arctic will not freeze for another twenty. The world is starting to look like home."},
 long:{pic:'picEarth',h:"The Milky Way's last great collision.",d:['10','Ga'],trip:.27531,next:.2,text:null},
 tunnel:{pic:null}
};

/* ---------- controls: one list drives both panels ---------- */
const C=[
 // LOOK
 {p:'look',s:'Buttons'},
 {p:'look',k:'btn',l:'Buttons',t:'color',d:'#262b32'},
 {p:'look',k:'finish',l:'Finish (matte → satin)',t:'range',min:0,max:1,step:.05,d:.5},
 {p:'look',k:'edge',l:'Top edge highlight',t:'range',min:0,max:.5,step:.02,d:.18},
 {p:'look',k:'shadow',l:'Drop shadow',t:'range',min:0,max:1,step:.05,d:.5},
 {p:'look',k:'keyR',l:'Button corner radius',t:'range',min:2,max:26,step:1,d:12,u:'px'},
 {p:'look',k:'key',l:'Button height',t:'range',min:44,max:68,step:1,d:52,u:'px'},
 {p:'look',k:'labels',l:'Labels under symbols',t:'toggle',d:true},
 {p:'look',k:'tray',l:'Glass tray behind buttons',t:'toggle',d:false},
 {p:'look',s:'Lights'},
 {p:'look',k:'light',l:'Views',t:'color',d:'#a9dcff'},
 {p:'look',k:'stop',l:'Stop',t:'color',d:'#ff4a3d'},
 {p:'look',k:'pause',l:'Pause',t:'color',d:'#ffb22e'},
 {p:'look',k:'glow',l:'Symbol glow',t:'range',min:0,max:1,step:.05,d:.6},
 {p:'look',k:'halo',l:'Halo when engaged',t:'range',min:0,max:1,step:.05,d:.55},
 {p:'look',k:'haloSize',l:'Halo size',t:'range',min:0,max:30,step:1,d:14,u:'px'},
 {p:'look',s:'Top panel'},
 {p:'look',k:'sheen',l:'Glass sheen (gradient)',t:'range',min:0,max:1,step:.05,d:.3},
 {p:'look',k:'tint',l:'Glass tint',t:'color',d:'#080b10'},
 {p:'look',k:'headCol',l:'Heading',t:'color',d:'#f4f6f8'},
 {p:'look',k:'dateCol',l:'Date',t:'color',d:'#f4f6f8'},
 {p:'look',k:'tripCol',l:'Trip bar',t:'color',d:'#6f93ab'},
 {p:'look',k:'nextCol',l:'Next bar',t:'color',d:'#a9dcff'},
 {p:'look',k:'textGlow',l:'Text glow',t:'range',min:0,max:1,step:.05,d:.35},
 {p:'look',k:'barGlow',l:'Bar glow',t:'range',min:0,max:1,step:.05,d:.5},
 // LAYOUT
 {p:'layout',s:'Type'},
 {p:'layout',k:'font',l:'Font',t:'select',o:[['grotesk','Space Grotesk'],['barlow','Barlow Semi Condensed'],['atkinson','Atkinson Hyperlegible Next']],d:'grotesk'},
 {p:'layout',k:'dateFont',l:'Date font',t:'select',o:[['mono','JetBrains Mono'],['same','Same as heading']],d:'mono'},
 {p:'layout',k:'title_',l:'Heading size',t:'range',min:14,max:34,step:.5,d:18.5,u:'px'},
 {p:'layout',k:'dateSize',l:'Date size',t:'range',min:12,max:30,step:.5,d:15,u:'px'},
 {p:'layout',k:'cardSize',l:'Text card size',t:'range',min:14,max:26,step:.5,d:16.5,u:'px'},
 {p:'layout',k:'labelSize',l:'Button label size',t:'range',min:9,max:16,step:.5,d:10.5,u:'px'},
 {p:'layout',s:'Panels'},
 {p:'layout',k:'glass',l:'Glass opacity',t:'range',min:0,max:.9,step:.02,d:.12},
 {p:'layout',k:'blur',l:'Blur',t:'range',min:0,max:40,step:1,d:2,u:'px'},
 {p:'layout',k:'sat',l:'Saturation behind glass',t:'range',min:100,max:200,step:5,d:120,u:'%'},
 {p:'layout',k:'bar',l:'Bar thickness',t:'range',min:1,max:8,step:.5,d:4.5,u:'px'},
 {p:'layout',k:'inset',l:'Side gap',t:'range',min:0,max:24,step:1,d:7,u:'px'},
 {p:'layout',k:'radius',l:'Top panel corner radius',t:'range',min:0,max:28,step:1,d:14,u:'px'},
 {p:'layout',k:'top',l:'Gap above top panel',t:'range',min:0,max:60,step:1,d:null,u:'px'},
 {p:'layout',k:'speed',l:'Tunnel speed',t:'range',min:.2,max:2,step:.1,d:1,u:'×'}
];
const desk=matchMedia('(min-width:900px)').matches;
const DEF={};for(const c of C)if(c.k)DEF[c.k]=c.d;DEF.top=desk?44:12;
let V={...DEF};
try{const s=JSON.parse(localStorage.getItem('tm-hud')||'{}');for(const k in s)if(k in DEF)V[k]=s[k];}catch(e){}

function build(){for(const c of C){const host=$(c.p+'Ctl');
 if(c.s){const h=document.createElement('h3');h.textContent=c.s;host.appendChild(h);continue;}
 const lab=document.createElement('label');lab.htmlFor='c_'+c.k;let inp;
 if(c.t==='toggle'){lab.className='tg';lab.textContent=c.l;inp=document.createElement('input');inp.type='checkbox';inp.id='c_'+c.k;lab.appendChild(inp);host.appendChild(lab);
  inp.addEventListener('change',()=>{V[c.k]=inp.checked;apply(true);});continue;}
 lab.textContent=c.l;
 if(c.t==='range'){const sp=document.createElement('span');sp.id='v_'+c.k;lab.appendChild(sp);inp=document.createElement('input');inp.type='range';inp.min=c.min;inp.max=c.max;inp.step=c.step;
  inp.addEventListener('input',()=>{V[c.k]=+inp.value;apply(true);});}
 else if(c.t==='color'){inp=document.createElement('input');inp.type='color';inp.id='c_'+c.k;inp.addEventListener('input',()=>{V[c.k]=inp.value;apply(true);});

/* ---------- tunnel: the simulator's shader (simulator v4.5) ---------- */
const FS=`precision highp float;
uniform vec2 R;uniform float T,E,F,S,W,C,P,K;uniform vec3 A,B;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
void main(){vec2 p=(gl_FragCoord.xy-.5*R)/R.y;float r0=length(p);
float far=pow(1.-smoothstep(0.,.55,r0),2.);
vec2 b=vec2(sin(W*.31)+.4*sin(W*.73),cos(W*.23)+.4*cos(W*.61))*.09*C;vec2 q=p-b*far;
float r=length(q),a=atan(q.y,q.x);float z=.35*K/r+P;
float gz=abs(fract(z)-.5),ga=abs(fract(a*12./6.2832)-.5);
float sp=r*r/(.35*K)*R.y;float g=(smoothstep(.06/pow(K,.3),0.,gz)*(.5+.5/pow(K,.35))*smoothstep(1.5,5.,sp)+smoothstep(.05,0.,ga))*smoothstep(.04,.35,r)*smoothstep(1.4,.6,r);
vec3 col=mix(A,B,E);float st=0.;
for(int i=0;i<4;i++){float d=fract(float(i)*.25+T*.12);float s=mix(18.,.8,d);vec2 gg=(p-b*far*.5)*s+float(i)*7.3;
vec2 id=floor(gg),f=fract(gg)-.5;vec2 o=vec2(h(id+1.),h(id+2.))-.5;float tw=.7+.3*sin(W*4.+h(id+3.)*40.);
st+=smoothstep(.07,0.,length(f-o*.7))*step(.82,h(id))*d*smoothstep(1.,.85,d)*tw;}
vec3 o=(g*col*.55+st*vec3(.95,.97,1.)+col*.12/(r*10.+1.))*F+vec3(1.,.93,.8)*S*exp(-r0*2.5);
gl_FragColor=vec4(o,1.);}`;
function oklch(Lc,Cc,h){for(let k=0;k<30;k++){const a=Cc*Math.cos(h*Math.PI/180),b=Cc*Math.sin(h*Math.PI/180);
 const l_=Lc+.3963377774*a+.2158037573*b,m_=Lc-.1055613458*a-.0638541728*b,s_=Lc-.0894841775*a-1.2914855480*b;const l=l_**3,m=m_**3,s=s_**3;
 const lin=[4.0767416621*l-3.3077115913*m+.2309699292*s,-1.2684380046*l+2.6097574011*m-.3413193965*s,-.0041960863*l-.7034186147*m+1.7076147010*s];
 if(lin.every(v=>v>=-1e-4&&v<=1.0001))return lin.map(v=>{v=Math.max(0,Math.min(1,v));return v<=.0031308?12.92*v:1.055*Math.pow(v,1/2.4)-.055;});Cc*=.85;}return [Lc,Lc,Lc];}
const TCOL=oklch(.62,.13,357);   // the ramp near the start of the Universe deck
const FORMULAS=['E = mc²','H₀ ≈ 70 km/s/Mpc','v = H₀d','λ = h / p','F = Gm₁m₂ / r²','T ≈ 2.7 K','ρc = 3H² / 8πG','z = Δλ / λ','L = 4πR²σT⁴'];
// a loop of the real stretch from The Methuselah star (13.25 Ga) to The first quasar (13.1 Ga), 186 km road
const SPAN=13.799e9,L=186,P0=.039785492,P1=.050655845,LOOP=30;
const MIL=[];for(let k=0,y=13.7e9;y>=13.0e9;y-=1e8,k++)MIL.push({y:Math.round(y/1e8)*1e8,km:(SPAN-y)/SPAN*L,ang:(k%2?Math.PI:0)+((k*.618)%1-.5)*.9});
const c=$('gl'),gl=c.getContext('webgl',{alpha:false}),o=$('ov'),ctx=o.getContext('2d');let U={};
if(gl){const VS='attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
 const sh=(ty,s)=>{const x=gl.createShader(ty);gl.shaderSource(x,s);gl.compileShader(x);return x;};
 const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);gl.useProgram(pr);
 gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
 const lp=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(lp);gl.vertexAttribPointer(lp,2,gl.FLOAT,false,0,0);
 ['R','T','E','F','S','W','C','A','B','P','K'].forEach(k=>U[k]=gl.getUniformLocation(pr,k));}
const flyers=[];let nextF=1.5,fSide=1,lastF=[];
let simT=0,tt=0,ph=0,ww=0,kd=1,last=performance.now(),uiT=0;
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
 if(scene==='tunnel'){
  const sp=playing?dt*V.speed:0;simT=(simT+sp)%LOOP;const u=simT/LOOP,p=P0+(P1-P0)*u,km=p*L;
  const kt=Math.pow(12,u*u);kd=playing?kd+(kt-kd)*(1-Math.exp(-dt/.4)):kd;
  tt+=sp;ph+=sp*kd;ww+=sp;
  const dpr=Math.min(2,devicePixelRatio||1),W2=Math.round(c.clientWidth*dpr),H2=Math.round(c.clientHeight*dpr);
  if(c.width!==W2||c.height!==H2){c.width=o.width=W2;c.height=o.height=H2;}
  if(gl){gl.viewport(0,0,c.width,c.height);gl.uniform2f(U.R,c.width,c.height);gl.uniform1f(U.T,tt);gl.uniform1f(U.P,ph);gl.uniform1f(U.K,kd);gl.uniform1f(U.W,ww);
   gl.uniform1f(U.E,0);gl.uniform1f(U.F,1);gl.uniform1f(U.S,0);gl.uniform1f(U.C,1);gl.uniform3fv(U.A,TCOL);gl.uniform3fv(U.B,TCOL);gl.drawArrays(gl.TRIANGLES,0,3);}
  ctx.clearRect(0,0,o.width,o.height);const cx=o.width/2,cy=o.height/2,H=o.height;ctx.textAlign='center';ctx.textBaseline='middle';
  const D=(P1-P0)*L/LOOP*V.speed*4,Z0=.9,ZF=3.2;
  for(const m of MIL){const ahead=m.km-km;if(ahead>D||ahead<-D)continue;const z=Z0+ahead/D*(ZF-Z0);if(z<.4)continue;
   const rr=(.35/z)*H*.55,x=cx+Math.cos(m.ang)*rr,y=cy+Math.sin(m.ang)*rr*.9,a=Math.max(0,Math.min(1,(3.2-z)*1.2)*Math.min(1,(z-.4)*2.5));
   ctx.font=`700 ${Math.max(4,15*dpr/z*1.1)}px "JetBrains Mono", monospace`;ctx.fillStyle=`rgba(235,238,250,${a*.9})`;ctx.fillText((m.y/1e9).toFixed(1)+' Ga',x,y);}
  if(playing){nextF-=dt;
   if(nextF<=0){nextF=7+Math.random()*3;fSide=-fSide;const pool=FORMULAS.filter(f=>!lastF.includes(f));const f=pool[Math.floor(Math.random()*pool.length)];lastF.push(f);if(lastF.length>4)lastF.shift();
    flyers.push({text:f,ang:(fSide<0?Math.PI:0)+(Math.random()-.5)*1.1,spin:(Math.random()<.5?-1:1)*.03,age:0});}}
  const fc=TCOL.map(v=>Math.round(v*255)).join(',');
  for(let i=flyers.length-1;i>=0;i--){const F=flyers[i];F.age+=playing?dt:0;if(F.age>10){flyers.splice(i,1);continue;}
   const z=2+(1.05-2)*F.age/10;F.ang+=F.spin*(playing?dt:0);const fade=Math.min(1,F.age/1.5)*Math.min(1,(10-F.age)/2),rr=(.35/z)*H*.55;
   let x=cx+Math.cos(F.ang)*rr;const y=cy+Math.sin(F.ang)*rr*.9;ctx.font=`400 ${13*dpr/z*1.1}px "JetBrains Mono", monospace`;
   const half=ctx.measureText(F.text).width/2,pad=10*dpr;x=Math.max(half+pad,Math.min(o.width-half-pad,x));ctx.fillStyle=`rgba(${fc},${.75*fade})`;ctx.fillText(F.text,x,y);}
  uiT-=dt;if(uiT<=0){uiT=.1;$('date').innerHTML=(SPAN*(1-p)/1e9).toFixed(3)+'<small>Ga</small>';
   $('tripBar').firstChild.style.width=(p*100)+'%';$('nextBar').firstChild.style.width=(u*100)+'%';}
 }
 requestAnimationFrame(frame);}

if(!SCENES[s0])s0='tunnel';$('scene').value=s0;
apply(false);setScene(s0);
